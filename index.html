<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  </head>

  <body>
    <header class="header">
      <div class="location-container">
        <h1 class="city-name"><span id="location">Loading...</span> / <span id="country"></span></h1>
        <p class="date-time" id="date-time">Wed, Aug 2026, 00:00</p>
      </div>

      <div class="nav-bar">
        <form class="search-container" id="search-form">
          <div class="search-box">
            <input
            class="search-input"
            id="search-bar"
            type="search"
            placeholder="Search city"
            aria-label="Search city"
            autocomplete="off"
            />
            <button class="search-button" id="search-btn" type="button" aria-label="Search">
            🔍</button>
          </div>

          <ul class="suggestions-list" id="suggestions-list"></ul>
        </form>

        <button type="button" id="unit-toggle" class="unit-toggle-btn">°F</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden"></div>

    <div class="hero-temp">
      <span class="temp">
        <span id="main-temperature">0</span>
        <img id="weather-icon" src="" alt=""></img>
      </span>
      
      <div class="more-container">
      <p class="more-info">
        <span id="weather-main">Weather</span>
      </p>
      <p class="more-info">Humidity: 
        <span id="humidity">N/A</span>
      </p>
      <p class="more-info">Feels Like: 
        <span id="feels-like">N/A</span>
      </p>
      <p class="more-info">Wind: 
        <span id="wind">N/A</span>
      </p>
      <p class="more-info">UV: 
        <span id="uv">N/A</span>
      </p>
      </div>
    </div>

    <div id="astro-card" class="astro-card">
      <div class="astro-item">
        <span>🌅 Sunrise</span>
        <span id="sunrise-time">--:--</span>
      </div>

      <div class="astro-item">
        <span>🌇 Sunset</span>
        <span id="sunset-time">--:--</span>
      </div>
    </div>

    <main class="bottom-sheet">
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="tomorrow">Tomorrow</button>
        <button class="tab-btn" data-tab="week">Week</button>
      </div>

      <div id="today-tab" class="tab-content active">
        <div id="today-container" class="hourly-scroll"></div>
      </div>

      <div id="tomorrow-tab" class="tab-content">
        <div id="tomorrow-container" class="hourly-scroll"></div>
      </div>

      <div id="week-tab" class="tab-content">
        <div id="week-container" class="weekly-container"></div>
      </div>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
